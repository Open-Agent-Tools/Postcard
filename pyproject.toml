[project]
name = "oat-postcard"
version = "0.4.1"
description = "Asynchronous 1-to-1 postcard messaging between AI agent sessions via a Git-backed ledger."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Open Agent Tools" }]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
oat-postcard = "oat_postcard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oat_postcard"]

[tool.ruff.lint]
# Pin to ruff's pre-0.16 default rule set (E4, E7, E9, F). 0.16 changed its
# implicit default when unconfigured to a much broader set, which turned a
# routine dependency bump into a lint-policy change unrelated to real code
# quality. Pinning here keeps future ruff upgrades from doing that silently
# again; broadening the rule set is a deliberate choice, made here.
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8",
    "ruff>=0.15.11",
]
